<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Safe Exm</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <img src="icons/icon48.png" alt="Safe Exm" class="logo-mark" width="22" height="22">
        <span class="logo-title">Safe Exm</span>
      </div>
      <div class="header-right">
        <div class="status-badge" id="statusBadge" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-dot" id="statusDot"></span>
          <span id="connectionStatus">Vérification…</span>
        </div>
        <button type="button" id="themeToggleBtn" class="icon-btn" title="Basculer papier / ardoise" aria-label="Changer le thème">
          <svg class="theme-icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="theme-icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="action-zone">
        <button id="analyzeBtn" class="action-btn-massive" type="button">
          <span class="btn-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <circle cx="11" cy="11" r="7"/>
              <path d="M20 20l-4.2-4.2"/>
              <path d="M11 8v6M8 11h6"/>
            </svg>
          </span>
          <span class="btn-text">Analyser la page</span>
        </button>
      </div>

      <div class="progress-section" id="progressSection" hidden>
        <div class="progress-info">
          <span class="progress-text" id="progressText">Analyse en cours…</span>
          <span class="progress-percentage" id="progressPercentage">0%</span>
        </div>
        <progress id="progressBarFill" class="progress-bar" value="0" max="100" aria-labelledby="progressText"></progress>
      </div>

      <span id="popupAnnouncer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>

      <div class="schema-status unknown" id="schemaStatus" hidden>
        <span class="schema-icon" id="schemaIcon" aria-hidden="true"></span>
        <span class="schema-text" id="schemaText">Lecture de la page…</span>
        <button type="button" class="btn schema-btn" id="schemaRediscoverBtn" title="Relancer la détection" aria-label="Relancer la détection du schéma">↺</button>
      </div>

      <details class="shortcuts-accordion">
        <summary>
          <span class="accordion-label">Raccourcis</span>
          <span class="accordion-chevron" aria-hidden="true">+</span>
        </summary>
        <div class="shortcuts-content">
          <p><span class="kbd-group"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>1</kbd></span><span>Activer ou couper</span></p>
          <p><span class="kbd-group"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>2</kbd></span><span>Analyser la page</span></p>
          <p><span class="kbd-group"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>3</kbd></span><span>Mode auto</span></p>
          <p><span class="kbd-group"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>E</kbd></span><span>Effacer les marques</span></p>
        </div>
      </details>

      <details class="stats-accordion" id="providerStatsSection">
        <summary class="stats-summary">
          <span class="accordion-label">Statistiques</span>
          <span class="accordion-chevron" aria-hidden="true">+</span>
        </summary>
        <div class="stats-content-wrap">
          <div class="stats-toolbar">
            <button type="button" id="resetStatsBtn" class="stats-reset-btn" title="Réinitialiser les statistiques" aria-label="Réinitialiser les statistiques">RàZ</button>
          </div>
          <div class="stats-content" id="providerStatsList">
            <p class="stats-empty" id="providerStatsEmpty">Aucune requête pour l'instant</p>
          </div>
        </div>
      </details>
    </main>

    <footer>
      <div class="footer-options">
        <label class="toggle-label">
          <input type="checkbox" id="extensionToggle">
          <span class="toggle-custom"></span>
          <span>Actif</span>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="autoModeToggle">
          <span class="toggle-custom"></span>
          <span>Auto</span>
        </label>

        <button type="button" id="clearBtn" class="clear-btn" title="Effacer les marques sur la page">Effacer</button>
      </div>

      <div class="settings-link-container">
        <a href="settings.html" target="_blank" id="settingsLink">
          <span>Paramètres</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </footer>
  </div>

  <script src="provider-catalog.js"></script>
  <script src="providers.js"></script>
  <script src="popup.js"></script>
</body>

</html>
